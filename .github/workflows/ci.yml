name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - run: npm audit --omit=dev
      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit
