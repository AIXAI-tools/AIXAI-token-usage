name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Compute SHA256
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if (-not $files) { throw "找不到 NSIS 安裝檔" }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 一律包成陣列：只有一個檔案時，@字串 會被拆成單一字元
          $files = @((Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe").FullName)
          gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes $files SHA256SUMS.txt
