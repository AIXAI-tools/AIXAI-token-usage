name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Prepare assets and SHA256
        shell: pwsh
        run: |
          # 檔名的空格換成 -（GitHub 上傳會把空格改成點，SHA256SUMS 的檔名就對不上）
          $files = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
          if ($files.Count -eq 0) { throw "找不到 NSIS 安裝檔" }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $lines = foreach ($f in $files) {
            $name = $f.Name -replace ' ', '-'
            Copy-Item $f.FullName "release-assets/$name"
            $h = (Get-FileHash "release-assets/$name" -Algorithm SHA256).Hash.ToLower()
            "$h  $name"
          }
          $lines | Set-Content -Path release-assets/SHA256SUMS.txt -Encoding ascii
          Get-Content release-assets/SHA256SUMS.txt
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 一律包成陣列：只有一個檔案時，@字串 會被拆成單一字元
          $files = @((Get-ChildItem "release-assets/*").FullName)
          gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes $files
