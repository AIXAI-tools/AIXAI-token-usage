<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIXAI Token Usage</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main id="panel" class="panel">
    <div id="view-main">
    <header class="head">
      <img class="logo" src="/app-icon.png" alt="" width="20" height="20">
      <span class="title">AIXAI Token Usage</span>
      <button id="mode" class="pill" type="button"></button>
      <button id="refresh" class="icon-btn" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6"></path><path d="M13 2.5v2.5h-2.5"></path></svg>
      </button>
      <button id="gear" class="icon-btn" type="button">
        <i id="gear-dot" class="dot" hidden></i>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.5v1.7M8 12.8v1.7M1.5 8h1.7M12.8 8h1.7M3.4 3.4l1.2 1.2M11.4 11.4l1.2 1.2M12.6 3.4l-1.2 1.2M4.6 11.4l-1.2 1.2"></path></svg>
      </button>
    </header>
    <div id="groups"></div>
    <footer class="foot">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 1l4 1.6v3c0 2.4-1.7 4.1-4 4.9-2.3-.8-4-2.5-4-4.9v-3z"></path></svg>
      <span id="privacy" class="grow"></span>
      <span id="updated"></span>
    </footer>
    </div>
    <div id="view-settings" hidden></div>
    <div id="view-update" hidden></div>
    <div id="view-report" hidden></div>
    <div id="view-reports" hidden></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
